<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Spieler-Tracker</title>
<!--
  OBS-Browserquelle: Live-Spielerzahl eines Minecraft-Servers.

  URL-Parameter:
    host=play.example.de   Server-Adresse (Pflicht, gerne mit :port)
    edition=bedrock        für Bedrock-Server (Standard: java)
    interval=60            Abfrage-Intervall in Sekunden (min. 30, die APIs cachen ~1 Minute)
    label=Spieler online   Überschrift
    max=0                  "/ max" ausblenden
    showhost=0             Server-Adresse unten ausblenden
    scale=1.5              alles vergrößern/verkleinern

  Empfohlene Größe der Browserquelle: 1000 × 400 (bei scale=1).
-->
<style>
  @font-face {
    font-family: "Minecraft";
    font-display: block;
    src: url("https://cdn.jsdelivr.net/npm/@south-paw/typeface-minecraft@1.0.0/files/minecraft.woff2") format("woff2"),
         url("https://cdn.jsdelivr.net/npm/@south-paw/typeface-minecraft@1.0.0/files/minecraft.woff") format("woff");
  }

  :root {
    --red-hi: #ff2a2a;
    --red: #d90b13;
    --red-mid: #a1050c;
    --red-dark: #640207;
    --red-deep: #3d0306;
    --outline: #000;
    --purple: #c45cff;
    --purple-hi: #e9a6ff;
    --purple-glow: rgba(186, 72, 255, 0.75);
    --online: #55ff55;
    --offline: #ff5555;
    --text: #ffffff;
    --scale: 1;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: transparent;   /* OBS: durchsichtig */
    overflow: hidden;
  }
  body {
    font-family: "Minecraft", monospace;
    color: var(--text);
    -webkit-font-smoothing: none;
    font-smooth: never;
  }

  .stage {
    display: flex;
    align-items: center;
    padding: 60px 70px 70px 30px;
    transform: scale(var(--scale));
    transform-origin: top left;
  }

  /* ---------- Logo ---------- */
  .logo {
    position: relative;
    flex: none;
    width: 240px;
    height: 240px;
    margin-right: -46px;     /* Logo ragt ein Stück über die Karte */
    z-index: 2;
    animation: float 4s ease-in-out infinite;
  }
  .logo img {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 18px var(--purple-glow));
    animation: glow 2.6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-8px) rotate(2deg); }
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 12px var(--purple-glow)); }
    50%      { filter: drop-shadow(0 0 30px var(--purple-glow)) brightness(1.08); }
  }

  /* ---------- Karte im Stil des Logos: rot, dicke schwarze Kontur, 3D-Kante ---------- */
  .card {
    position: relative;
    min-width: 520px;
    padding: 26px 40px 28px 76px;
    background:
      linear-gradient(180deg, var(--red-hi) 0%, var(--red) 35%, var(--red-mid) 75%, var(--red-dark) 100%);
    border: 7px solid var(--outline);
    box-shadow:
      0 12px 0 0 var(--red-deep),          /* 3D-Unterseite */
      0 12px 0 7px var(--outline),         /* Kontur der Unterseite */
      0 0 40px 10px var(--purple-glow),    /* lila Leuchten */
      0 0 90px 20px rgba(186, 72, 255, 0.35);
  }
  /* Glanzlichter wie die hellen Pixel-Streifen im Logo */
  .card::before,
  .card::after {
    content: "";
    position: absolute;
    background: rgba(255, 110, 110, 0.6);
    border-radius: 6px;
  }
  .card::before { top: 10px; left: 72px; width: 70px; height: 9px; }
  .card::after  { top: 10px; right: 26px; width: 34px; height: 9px; }
  .shade {
    position: absolute;
    inset: auto 0 0 0;
    height: 14px;
    background: rgba(0, 0, 0, 0.18);
    pointer-events: none;
  }

  .label {
    font-size: 24px;
    line-height: 1;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #ffd6d6;
    text-shadow: 3px 3px 0 var(--red-deep);
    margin-bottom: 14px;
  }

  .count {
    display: flex;
    align-items: baseline;
    gap: 14px;
    white-space: nowrap;
  }
  .num {
    font-size: 96px;
    line-height: 1;
    color: var(--text);
    text-shadow: 6px 6px 0 var(--red-deep);
    font-variant-numeric: tabular-nums;
    transition: color 0.4s;
  }
  .num.bump { animation: bump 0.5s ease-out; }
  @keyframes bump {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.08); color: var(--purple-hi); }
    100% { transform: scale(1); }
  }
  .max {
    font-size: 40px;
    color: #ffb3b3;
    text-shadow: 4px 4px 0 var(--red-deep);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    font-size: 16px;
    line-height: 1;
    color: #ffd6d6;
    text-shadow: 2px 2px 0 var(--red-deep);
  }
  .dot {
    width: 14px;
    height: 14px;
    background: var(--online);
    border: 3px solid var(--outline);
    box-shadow: 0 0 10px var(--online);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .offline .dot { background: var(--offline); box-shadow: 0 0 10px var(--offline); animation: none; }
  .waiting .dot { background: #aaaaaa; box-shadow: none; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  /* +3 / -2 bei Änderungen */
  .delta {
    position: absolute;
    right: 34px;
    top: 52px;
    font-size: 40px;
    text-shadow: 4px 4px 0 var(--outline);
    pointer-events: none;
    animation: rise 2.2s ease-out forwards;
  }
  .delta.up   { color: var(--purple-hi); }
  .delta.down { color: #ff9b9b; }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(16px); }
    15%  { opacity: 1; transform: translateY(0); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-40px); }
  }

  /* lila Funken um das Logo */
  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    background: var(--purple-hi);
    box-shadow: 0 0 8px var(--purple);
    opacity: 0;
    animation: spark 3s ease-in-out infinite;
  }
  @keyframes spark {
    0%, 100% { opacity: 0; transform: scale(0.4); }
    50%      { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="logo" id="logo">
      <img src="logo.png" alt="">
    </div>
    <div class="card waiting" id="card">
      <div class="label" id="label">Spieler online</div>
      <div class="count">
        <span class="num" id="num">–</span>
        <span class="max" id="max"></span>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span id="status">Verbinde …</span>
      </div>
      <div class="shade"></div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const host = (params.get('host') || '').trim();
  const edition = params.get('edition') === 'bedrock' ? 'bedrock' : 'java';
  const interval = Math.max(30, Number(params.get('interval')) || 60) * 1000;
  const showMax = params.get('max') !== '0';
  const showHost = params.get('showhost') !== '0';
  const scale = Number(params.get('scale')) || 1;

  const $ = (id) => document.getElementById(id);
  const card = $('card'), num = $('num'), maxEl = $('max'), statusEl = $('status');
  const fmt = new Intl.NumberFormat('de-DE');

  document.documentElement.style.setProperty('--scale', scale);
  if (params.get('label')) $('label').textContent = params.get('label');

  // Funken ums Logo
  const logo = $('logo');
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    const a = (i / 10) * Math.PI * 2;
    s.style.left = `${120 + Math.cos(a) * (100 + (i % 3) * 14) - 3}px`;
    s.style.top = `${120 + Math.sin(a) * (100 + (i % 2) * 18) - 3}px`;
    s.style.animationDelay = `${(i * 0.37) % 3}s`;
    logo.appendChild(s);
  }

  // Zwei Status-APIs, falls eine ausfällt. Beide liefern Spielerzahl und Maximum.
  const sources = [
    async () => {
      const d = await getJson(`https://api.mcstatus.io/v2/status/${edition}/${encodeURIComponent(host)}`);
      return { online: d.online, players: d.players?.online ?? 0, max: d.players?.max ?? 0 };
    },
    async () => {
      const path = edition === 'bedrock' ? 'bedrock/3' : '3';
      const d = await getJson(`https://api.mcsrvstat.us/${path}/${encodeURIComponent(host)}`);
      return { online: d.online, players: d.players?.online ?? 0, max: d.players?.max ?? 0 };
    },
  ];

  async function getJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function fetchStatus() {
    for (const source of sources) {
      try { return await source(); } catch (e) { console.warn(e); }
    }
    throw new Error('Keine API erreichbar');
  }

  let shown = null;    // aktuell angezeigte Zahl
  let anim = 0;

  function animateTo(target) {
    const from = shown ?? 0;
    shown = target;
    cancelAnimationFrame(anim);
    if (from === target) { num.textContent = fmt.format(target); return; }
    const start = performance.now();
    const dur = Math.min(1600, 500 + Math.abs(target - from) * 20);
    const step = (t) => {
      const p = Math.min(1, (t - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      num.textContent = fmt.format(Math.round(from + (target - from) * e));
      if (p < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }

  function showDelta(diff) {
    const el = document.createElement('div');
    el.className = `delta ${diff > 0 ? 'up' : 'down'}`;
    el.textContent = `${diff > 0 ? '+' : '−'}${fmt.format(Math.abs(diff))}`;
    card.appendChild(el);
    setTimeout(() => el.remove(), 2300);
    num.classList.remove('bump');
    void num.offsetWidth;
    num.classList.add('bump');
  }

  function setState(cls, text) {
    card.classList.remove('waiting', 'offline');
    if (cls) card.classList.add(cls);
    statusEl.textContent = text;
  }

  async function update() {
    try {
      const s = await fetchStatus();
      if (!s.online) {
        setState('offline', showHost ? `${host} · offline` : 'Server offline');
        animateTo(0);
        maxEl.textContent = '';
        return;
      }
      if (shown !== null && s.players !== shown) showDelta(s.players - shown);
      animateTo(s.players);
      maxEl.textContent = showMax && s.max ? `/ ${fmt.format(s.max)}` : '';
      setState(null, showHost ? host : 'Live');
    } catch {
      // letzte Zahl stehen lassen, nur den Status anpassen
      setState('waiting', 'Verbinde …');
    }
  }

  if (!host) {
    setState('offline', 'URL-Parameter ?host= fehlt');
  } else {
    update();
    setInterval(update, interval);
  }
</script>
</body>
</html>
